<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story — 5 Months</title>
<meta name="description" content="Our long-distance love story, one month at a time. Happy 5th monthsary 💕">
<meta property="og:type" content="website">
<meta property="og:title" content="Our Story — 5 Months">
<meta property="og:description" content="Our long-distance love story, one month at a time. Happy 5th monthsary 💕">
<meta property="og:url" content="https://usernamehaze.github.io/tomydearest/">
<meta property="og:image" content="https://usernamehaze.github.io/tomydearest/canva/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #141414;
    --red: #e50914;
    --text: #fff;
    --muted: #b3b3b3;
    --card-radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- Nav ---------- */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; gap: 32px;
    padding: 18px 4%;
    background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, transparent 100%);
    transition: background .3s;
  }
  nav.solid { background: var(--bg); }
  .logo {
    color: var(--red); font-weight: 900; font-size: 30px;
    letter-spacing: 1px; text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  nav ul { display: flex; gap: 20px; list-style: none; font-size: 14px; }
  nav li { color: #e5e5e5; cursor: pointer; }
  nav li.active { font-weight: 700; color: #fff; }
  .avatar {
    margin-left: auto; width: 32px; height: 32px; border-radius: 4px;
    background: linear-gradient(135deg, #e50914, #ff7aa2);
    display: grid; place-items: center; font-size: 16px;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; height: 82vh; min-height: 480px;
    display: flex; align-items: center;
    padding: 0 4%;
    background:
      linear-gradient(77deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.2) 60%, transparent 85%),
      var(--hero-bg, radial-gradient(circle at 75% 40%, #ff4d6d 0%, #a4133c 35%, #2b0a14 75%));
    background-size: cover; background-position: center;
  }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 140px;
    background: linear-gradient(180deg, transparent, var(--bg));
  }
  .hero-content { position: relative; z-index: 2; max-width: 560px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: 3px; color: #ddd; margin-bottom: 14px;
  }
  .badge b { color: var(--red); font-size: 22px; letter-spacing: 0; }
  .hero h1 {
    font-size: clamp(40px, 7vw, 76px); line-height: 1; font-weight: 900;
    text-shadow: 2px 4px 12px rgba(0,0,0,.45); margin-bottom: 16px;
  }
  .hero .meta { display: flex; gap: 12px; align-items: center; color: #ddd; font-size: 15px; margin-bottom: 14px; }
  .match { color: #46d369; font-weight: 700; }
  .pill { border: 1px solid #888; padding: 0 6px; font-size: 12px; }
  .hero p { font-size: 18px; line-height: 1.45; color: #eee; text-shadow: 1px 1px 4px rgba(0,0,0,.5); margin-bottom: 24px; }
  .btns { display: flex; gap: 12px; }
  .btn {
    border: 0; border-radius: 4px; cursor: pointer;
    padding: 11px 26px; font-size: 17px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn-play { background: #fff; color: #000; }
  .btn-play:hover { background: rgba(255,255,255,.75); }
  .btn-info { background: rgba(109,109,110,.7); color: #fff; }
  .btn-info:hover { background: rgba(109,109,110,.45); }
  .floating-hearts span {
    position: absolute; z-index: 1; opacity: .25; animation: float 9s linear infinite;
  }
  @keyframes float {
    from { transform: translateY(0) rotate(0); opacity: 0; }
    15% { opacity: .35; }
    to { transform: translateY(-80vh) rotate(25deg); opacity: 0; }
  }

  /* ---------- Rows ---------- */
  main { position: relative; z-index: 3; margin-top: -90px; padding-bottom: 60px; }
  .row { margin: 0 0 42px; }
  .row h2 { font-size: 21px; font-weight: 700; padding: 0 4%; margin-bottom: 12px; color: #e5e5e5; }
  .slider {
    display: flex; gap: 8px; padding: 24px 4%; margin: -24px 0;
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .slider::-webkit-scrollbar { display: none; }

  .card {
    position: relative; flex: 0 0 auto; width: 300px; aspect-ratio: 16 / 9;
    border-radius: var(--card-radius); overflow: hidden; cursor: pointer;
    scroll-snap-align: start;
    background: var(--poster); background-size: cover; background-position: center;
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .card:hover { transform: scale(1.12); z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.7); }
  .card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.85)); }
  .card .num {
    position: absolute; top: 8px; left: 10px;
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    background: var(--red); padding: 2px 7px; border-radius: 2px;
  }
  .card .emoji { position: absolute; top: 14%; right: 10%; font-size: 54px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .card .info { position: absolute; left: 12px; right: 12px; bottom: 10px; }
  .card h3 { font-size: 19px; font-weight: 800; line-height: 1.1; }
  .card small { color: #ccc; font-size: 12px; }
  .card .progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--red); }

  /* Top-10 style ranked cards */
  .rank { display: flex; align-items: flex-end; flex: 0 0 auto; cursor: pointer; scroll-snap-align: start; }
  .rank .big {
    font-size: 190px; font-weight: 900; line-height: .8; letter-spacing: -12px;
    color: var(--bg); -webkit-text-stroke: 4px #595959; margin-right: -14px;
  }
  .rank .tall {
    width: 140px; aspect-ratio: 2 / 3; border-radius: var(--card-radius);
    background: var(--poster); background-size: cover; background-position: center;
    position: relative; overflow: hidden; transition: transform .3s;
  }
  .rank:hover .tall { transform: scale(1.08); }
  .rank .tall span {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    font-size: 14px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.8);
  }

  .card.soon { filter: grayscale(.6); }
  .card.soon .num { background: #444; }

  /* ---------- Modal ---------- */
  .modal-bg {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: min(820px, 100%); background: #181818; border-radius: 8px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.8); animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-hero {
    position: relative; aspect-ratio: 16 / 8;
    background: var(--poster); background-size: cover; background-position: center;
    display: flex; align-items: flex-end; padding: 32px;
  }
  .modal-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, #181818); }
  .modal-hero h2 { position: relative; z-index: 1; font-size: clamp(28px, 5vw, 46px); font-weight: 900; }
  .modal-hero .emoji { position: absolute; top: 18%; right: 8%; font-size: 90px; }
  .close {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: #181818; color: #fff; font-size: 20px; cursor: pointer;
  }
  .modal-body { display: grid; grid-template-columns: 2fr 1fr; gap: 28px; padding: 8px 32px 36px; }
  .modal-body p { line-height: 1.6; color: #ddd; }
  .modal-body .side { font-size: 14px; color: #777; line-height: 1.8; }
  .modal-body .side b { color: #ddd; font-weight: 400; }
  .moments { grid-column: 1 / -1; }
  .moments h4 { font-size: 20px; margin-bottom: 10px; }
  .moment {
    display: flex; gap: 18px; align-items: center;
    padding: 16px 12px; border-bottom: 1px solid #404040;
  }
  .moment .i { font-size: 22px; color: #d2d2d2; width: 24px; text-align: center; }
  .moment strong { display: block; margin-bottom: 4px; }
  .moment span { color: #aaa; font-size: 14px; }

  .distance {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    font-size: 15px; color: #eee; margin-bottom: 18px;
  }
  .distance .plane { display: inline-block; animation: fly 3s ease-in-out infinite; }
  @keyframes fly { 50% { transform: translateX(8px) translateY(-3px); } }
  .countdown {
    display: inline-flex; gap: 10px; align-items: baseline;
    background: rgba(0,0,0,.45); border-left: 3px solid var(--red);
    padding: 8px 14px; margin-bottom: 24px; font-size: 14px; color: #ddd;
  }
  .countdown b { font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
  .stat {
    flex: 0 0 auto; width: 220px; padding: 20px; border-radius: var(--card-radius);
    background: #222; border-top: 3px solid var(--red); scroll-snap-align: start;
  }
  .stat b { display: block; font-size: 38px; font-weight: 900; margin-bottom: 4px; }
  .stat span { color: var(--muted); font-size: 14px; }

  /* ---------- Photos & videos ---------- */
  .card video.preview, .hero video.bg, .modal-hero video.bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .card video.preview { opacity: 0; transition: opacity .4s; }
  .card:hover video.preview { opacity: 1; }
  .card .has-video {
    position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: 700;
    background: rgba(0,0,0,.6); padding: 2px 7px; border-radius: 2px;
  }
  .hero video.bg { z-index: 0; }
  .hero .hero-fade {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(77deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.2) 60%, transparent 85%);
  }
  .modal-hero video.bg { z-index: 0; }
  .sound {
    position: absolute; right: 32px; bottom: 32px; z-index: 2;
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,.7); background: rgba(0,0,0,.4); color: #fff; font-size: 18px;
  }
  .gallery { grid-column: 1 / -1; }
  .gallery h4 { font-size: 20px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .thumb {
    position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden;
    cursor: pointer; background: #2a2a2a; border: 0; padding: 0;
  }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .thumb:hover img, .thumb:hover video { transform: scale(1.06); }
  .thumb .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 34px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.7);
  }
  .empty {
    border: 2px dashed #444; border-radius: 6px; padding: 22px;
    color: #888; font-size: 14px; line-height: 1.6; text-align: center;
  }
  .empty code { color: #ddd; }

  .lightbox {
    position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.95);
    display: none; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img, .lightbox video { max-width: 92vw; max-height: 86vh; border-radius: 4px; }
  .lightbox button {
    position: absolute; background: none; border: 0; color: #fff; cursor: pointer;
    font-size: 44px; padding: 12px 18px; opacity: .8;
  }
  .lightbox button:hover { opacity: 1; }
  .lb-close { top: 10px; right: 10px; font-size: 30px !important; }
  .lb-prev { left: 8px; } .lb-next { right: 8px; }
  .lb-count { position: absolute; bottom: 18px; color: #aaa; font-size: 14px; }

  footer { text-align: center; color: #757575; font-size: 13px; padding: 30px 4% 50px; }
  footer b { color: var(--red); }

  @media (max-width: 640px) {
    nav ul { display: none; }
    .logo { font-size: 22px; }
    .hero { height: auto; min-height: 0; padding-top: 100px; padding-bottom: 110px; }
    main { margin-top: -50px; }
    .hero p { font-size: 15px; }
    .card { width: 240px; }
    .rank .big { font-size: 130px; }
    .rank .tall { width: 110px; }
    .modal-body { grid-template-columns: 1fr; padding: 8px 20px 28px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  }
</style>
</head>
<body>

<nav id="nav">
  <div class="logo">Our Story</div>
  <ul>
    <li class="active">Home</li>
    <li>Monthsaries</li>
    <li>Firsts</li>
    <li>My List ♥</li>
  </ul>
  <div class="avatar">💕</div>
</nav>

<header class="hero" id="hero">
  <div id="hero-video"></div>
  <div class="floating-hearts" id="hearts"></div>
  <div class="hero-content">
    <div class="badge"><b>N</b>SERIES · NEW EPISODE</div>
    <h1 id="hero-title">Five Months</h1>
    <div class="meta">
      <span class="match">100% Match</span>
      <span id="hero-date"></span>
      <span class="pill">Forever+</span>
      <span>5 Episodes</span>
    </div>
    <div class="distance" id="hero-distance"></div>
    <p id="hero-desc"></p>
    <div class="countdown" id="countdown"></div>
    <div class="btns">
      <button class="btn btn-play" onclick="openMonth(MONTHS.length - 1)">▶ Play</button>
      <button class="btn btn-info" onclick="document.getElementById('timeline').scrollIntoView({behavior:'smooth'})">ⓘ Our Timeline</button>
    </div>
  </div>
</header>

<main>
  <section class="row" id="timeline">
    <h2>Our Timeline: Month by Month</h2>
    <div class="slider" id="row-timeline"></div>
  </section>

  <section class="row">
    <h2>Top 5 Moments of Us</h2>
    <div class="slider" id="row-top"></div>
  </section>

  <section class="row">
    <h2>Long Distance, By the Numbers</h2>
    <div class="slider" id="row-stats"></div>
  </section>

  <section class="row">
    <h2>Continue Watching for Us</h2>
    <div class="slider" id="row-continue"></div>
  </section>
</main>

<footer>Made with <b>♥</b> from <span id="foot-distance"></span> away · Happy 5th monthsary, love</footer>

<div class="lightbox" id="lightbox" onclick="if (event.target === this) closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-prev" onclick="stepLightbox(-1)">‹</button>
  <div id="lb-media"></div>
  <button class="lb-next" onclick="stepLightbox(1)">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if (event.target === this) closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
  // ============================================================
  //  EDIT THIS PART: your start date and your months together.
  //
  //  Pictures & videos: put the files in the media/ folder, then
  //  for each month fill in (all optional):
  //    photo:   cover picture for the boxes, e.g. "media/month1/cover.jpg"
  //    video:   clip that plays when you hover the box (and in the
  //             big banner for the latest month), e.g. "media/month1/clip.mp4"
  //    gallery: more pictures and videos shown when you open the month,
  //             e.g. ["media/month1/1.jpg", "media/month1/call.mp4"]
  //  Videos should be .mp4 (or .webm). Keep them small (under ~50 MB).
  // ============================================================
  const START_DATE = "2026-05-20"; // the day you became official (YYYY-MM-DD)

  // Long distance details
  const MY_CITY = "Iloilo City, Philippines";      // where you are
  const YOUR_CITY = "Calgary, Canada";  // where they are
  const KM_APART = 11259;          // distance between you (km)
  const NEXT_VISIT = "2026-12-20"; // next time you'll see each other (YYYY-MM-DD), or "" if not set yet

  const MONTHS = [
    {
      title: "The Beginning",
      emoji: "📱",
      tagline: "Different cities, same feeling.",
      story: "The first month of us: good-morning texts, goodnight calls, and realizing the distance didn't matter as much as we thought.",
      moments: [
        ["💬", "Making it official", "Write how it happened here."],
        ["📞", "Our first video call", "Neither of us wanted to hang up."],
        ["🌙", "Falling asleep on call", "Still connected when we woke up."]
      ],
      colors: ["#ff758f", "#c9184a"],
      photo: "",
      video: "",
      gallery: []
    },
    {
      title: "Getting Closer",
      emoji: "💌",
      tagline: "Closer, even from far away.",
      story: "Month two: learning each other's routines and time zones, and finding little ways to feel close.",
      moments: [
        ["🎬", "Watching a movie together", "Pressed play at the same time, from two different places."],
        ["😂", "First inside joke", "Nobody else gets it, and that's the point."],
        ["🍜", "Virtual dinner date", "Same food, two tables, one call."]
      ],
      colors: ["#ffb703", "#fb5607"],
      photo: "",
      video: "",
      gallery: []
    },
    {
      title: "Worth Every Mile",
      emoji: "✈️",
      tagline: "Every mile was worth it.",
      story: "Month three: counting down the days, making plans, and dreaming about the next time we're in the same place.",
      moments: [
        ["📦", "A package in the mail", "A surprise from far away."],
        ["🗓️", "Planning a visit", "Counting down the days."],
        ["🎵", "Our song", "The song that plays when I miss you."]
      ],
      colors: ["#48cae4", "#023e8a"],
      photo: "",
      video: "",
      gallery: []
    },
    {
      title: "Through It All",
      emoji: "🫶",
      tagline: "Stronger every day.",
      story: "Month four: the good days and the hard ones, the missing-you nights. Learning that we're a team, no matter the distance.",
      moments: [
        ["🧸", "Taking care of each other", "Being there, even through a screen."],
        ["🎁", "A surprise", "The sweetest thing you did."],
        ["🏡", "Home", "Home is a person, not a place."]
      ],
      colors: ["#b5179e", "#3a0ca3"],
      photo: "",
      video: "",
      gallery: []
    },
    {
      title: "Five Months",
      emoji: "💖",
      tagline: "And we're just getting started.",
      story: "Five months of you and me, across the miles. Every month has been a new favorite episode, and I can't wait for the one where we're finally in the same place.",
      moments: [
        ["🥂", "Happy 5th monthsary", "Today's episode."],
        ["✨", "What I love most", "Write your favorite thing about them here."],
        ["🤗", "Next time I see you", "The hug I've been saving up."]
      ],
      colors: ["#ff4d6d", "#590d22"],
      photo: "",
      video: "",
      gallery: [
        "media/month5/flowers-surprise.mp4",
        "media/month5/flowers.jpg",
        "media/month5/video-call.jpg",
        "media/month5/more-than-friends.jpg"
      ]
    }
  ];
  // ============================================================

  const start = new Date(START_DATE + "T00:00:00");
  const fmt = d => d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  const monthDate = i => { const d = new Date(start); d.setMonth(d.getMonth() + i + 1); return d; };
  const poster = m => m.photo
    ? `url("${m.photo}")`
    : `radial-gradient(circle at 80% 20%, rgba(255,255,255,.25), transparent 45%), linear-gradient(135deg, ${m.colors[0]}, ${m.colors[1]})`;

  const isVideo = src => /\.(mp4|webm|mov|m4v)$/i.test(src);
  // A video's thumbnail is a .jpg with the same name next to it, if there is one
  const posterOf = src => src.replace(/\.\w+$/, ".jpg");
  const cover = m => m.photo || m.video ? "" : `<div class="emoji">${m.emoji}</div>`;
  const preview = m => m.video
    ? `<video class="preview" src="${m.video}" muted loop playsinline preload="metadata"></video>`
    : "";

  // Hero = latest month
  const latest = MONTHS[MONTHS.length - 1];
  document.getElementById("hero-title").textContent = latest.title;
  document.getElementById("hero-date").textContent = fmt(monthDate(MONTHS.length - 1));
  document.getElementById("hero-desc").textContent = latest.story;
  if (latest.photo) document.getElementById("hero").style.setProperty("--hero-bg", `url("${latest.photo}")`);
  if (latest.video) document.getElementById("hero-video").innerHTML =
    `<video class="bg" src="${latest.video}" autoplay muted loop playsinline></video><div class="hero-fade"></div>`;

  const km = KM_APART.toLocaleString() + " km";
  document.getElementById("hero-distance").innerHTML =
    `📍 ${MY_CITY} <span class="plane">✈️</span> ${YOUR_CITY} <span class="pill">${km} apart</span>`;
  document.getElementById("foot-distance").textContent = km;

  const visit = NEXT_VISIT ? new Date(NEXT_VISIT + "T00:00:00") : null;
  const countdown = document.getElementById("countdown");
  function tick() {
    if (!visit) { countdown.innerHTML = "Next visit: <b>coming soon</b>"; return; }
    const ms = visit - new Date();
    if (ms <= 0) { countdown.innerHTML = "<b>Together right now 🤗</b>"; return; }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24,
          m = Math.floor(ms / 6e4) % 60, sec = Math.floor(ms / 1e3) % 60;
    const p = n => String(n).padStart(2, "0");
    countdown.innerHTML = `Next hug in <b>${d}d ${p(h)}h ${p(m)}m ${p(sec)}s</b>`;
  }
  tick(); setInterval(tick, 1000);

  const daysTogether = Math.floor((new Date() - start) / 864e5);
  const stats = [
    [daysTogether.toLocaleString(), "days together"],
    [KM_APART.toLocaleString(), "km between us"],
    [MONTHS.length, "monthsaries, and counting"],
    [visit ? Math.max(0, Math.ceil((visit - new Date()) / 864e5)) : "?", "days until I see you"],
    ["∞", "times I've missed you"]
  ];
  document.getElementById("row-stats").innerHTML =
    stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  // Timeline row
  document.getElementById("row-timeline").innerHTML = MONTHS.map((m, i) => `
    <div class="card" style="--poster:${poster(m)}" onclick="openMonth(${i})">
      ${cover(m)}${preview(m)}
      <div class="shade"></div>
      <div class="num">MONTH ${i + 1}</div>
      ${m.video ? `<div class="has-video">▶ VIDEO</div>` : ""}
      <div class="info"><h3>${m.title}</h3><small>${fmt(monthDate(i))}</small></div>
    </div>`).join("") + `
    <div class="card soon" style="--poster:linear-gradient(135deg,#333,#111)">
      <div class="emoji">✈️</div><div class="shade"></div>
      <div class="num">COMING SOON</div>
      <div class="info"><h3>${visit ? "Next Visit" : "Month " + (MONTHS.length + 1)}</h3><small>${fmt(visit || monthDate(MONTHS.length))}</small></div>
    </div>`;

  // Top 5 ranked row: one highlight moment per month
  document.getElementById("row-top").innerHTML = MONTHS.map((m, i) => `
    <div class="rank" onclick="openMonth(${i})">
      <div class="big">${i + 1}</div>
      <div class="tall" style="--poster:${poster(m)}"><span>${m.moments[0][0]} ${m.moments[0][1]}</span></div>
    </div>`).join("");

  // Continue watching: progress bars fill as the months go by
  document.getElementById("row-continue").innerHTML = MONTHS.slice().reverse().map((m, r) => {
    const i = MONTHS.length - 1 - r;
    return `
    <div class="card" style="--poster:${poster(m)}" onclick="openMonth(${i})">
      ${cover(m)}${preview(m)}
      <div class="shade"></div>
      <div class="info"><h3>${m.tagline}</h3><small>S1:E${i + 1} · ${m.title}</small></div>
      <div class="progress" style="width:${i === MONTHS.length - 1 ? 35 : 100}%"></div>
    </div>`;
  }).join("");

  function openMonth(i) {
    const m = MONTHS[i];
    document.getElementById("modal").innerHTML = `
      <div class="modal-hero" style="--poster:${poster(m)}">
        ${m.video ? `<video class="bg" id="modal-video" src="${m.video}" autoplay muted loop playsinline></video>` : ""}
        <button class="close" onclick="closeModal()">✕</button>
        ${cover(m)}
        <h2>${m.title}</h2>
        ${m.video ? `<button class="sound" onclick="toggleSound(this)" title="Sound">🔇</button>` : ""}
      </div>
      <div class="modal-body">
        <div>
          <div class="meta" style="display:flex;gap:12px;margin-bottom:12px;color:#ddd">
            <span class="match">100% Match</span><span>${fmt(monthDate(i))}</span><span class="pill">S1:E${i + 1}</span>
          </div>
          <p>${m.story}</p>
        </div>
        <div class="side">
          <div>Episode: <b>Month ${i + 1}</b></div>
          <div>Starring: <b>You & Me</b></div>
          <div>Genre: <b>Romance, Comedy, Adventure</b></div>
          <div>This episode is: <b>${m.tagline}</b></div>
        </div>
        <div class="moments">
          <h4>Moments</h4>
          ${m.moments.map(([icon, t, d], k) => `
            <div class="moment"><div class="i">${k + 1}</div><div style="font-size:30px">${icon}</div>
            <div><strong>${t}</strong><span>${d}</span></div></div>`).join("")}
        </div>
        <div class="gallery">
          <h4>Photos & Videos</h4>
          ${m.gallery.length ? `<div class="grid">${m.gallery.map((src, k) => `
            <button class="thumb" onclick="openLightbox(${i}, ${k})">
              ${isVideo(src)
                ? `<video src="${src}#t=0.5" poster="${posterOf(src)}" muted playsinline preload="metadata"></video><div class="play">▶</div>`
                : `<img src="${src}" alt="" loading="lazy">`}
            </button>`).join("")}</div>`
          : `<div class="empty">No pictures or videos for this month yet.<br>
              Add them to the <code>gallery</code> list for Month ${i + 1} in <code>index.html</code>.</div>`}
        </div>
      </div>`;
    document.getElementById("modal-bg").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    document.getElementById("modal-bg").classList.remove("open");
    document.getElementById("modal").innerHTML = ""; // stops any playing video
    document.body.style.overflow = "";
  }
  function toggleSound(btn) {
    const v = document.getElementById("modal-video");
    v.muted = !v.muted;
    btn.textContent = v.muted ? "🔇" : "🔊";
  }

  // Full-screen viewer for gallery pictures and videos
  let lb = { month: 0, index: 0 };
  function openLightbox(month, index) {
    lb = { month, index };
    const items = MONTHS[month].gallery;
    const src = items[index];
    document.getElementById("lb-media").innerHTML = isVideo(src)
      ? `<video src="${src}" poster="${posterOf(src)}" controls autoplay playsinline></video>`
      : `<img src="${src}" alt="">`;
    document.getElementById("lb-count").textContent = `${index + 1} / ${items.length}`;
    document.querySelector(".lb-prev").style.visibility = items.length > 1 ? "visible" : "hidden";
    document.querySelector(".lb-next").style.visibility = items.length > 1 ? "visible" : "hidden";
    document.getElementById("lightbox").classList.add("open");
  }
  function stepLightbox(dir) {
    const n = MONTHS[lb.month].gallery.length;
    openLightbox(lb.month, (lb.index + dir + n) % n);
  }
  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    document.getElementById("lb-media").innerHTML = "";
  }
  document.addEventListener("keydown", e => {
    const lbOpen = document.getElementById("lightbox").classList.contains("open");
    if (e.key === "Escape") lbOpen ? closeLightbox() : closeModal();
    if (lbOpen && e.key === "ArrowLeft") stepLightbox(-1);
    if (lbOpen && e.key === "ArrowRight") stepLightbox(1);
  });

  // Netflix-style hover previews: play a month's clip while hovering its box
  document.addEventListener("mouseover", e => {
    const v = e.target.closest(".card")?.querySelector("video.preview");
    if (v) v.play().catch(() => {});
  });
  document.addEventListener("mouseout", e => {
    const card = e.target.closest(".card");
    if (card && !card.contains(e.relatedTarget)) card.querySelector("video.preview")?.pause();
  });

  window.addEventListener("scroll", () => document.getElementById("nav").classList.toggle("solid", scrollY > 40));

  // Floating hearts in the hero
  const hearts = document.getElementById("hearts");
  for (let k = 0; k < 14; k++) {
    const s = document.createElement("span");
    s.textContent = "♥";
    s.style.left = (40 + Math.random() * 58) + "%";
    s.style.bottom = (-10 + Math.random() * 20) + "%";
    s.style.fontSize = (16 + Math.random() * 30) + "px";
    s.style.color = "#ffccd5";
    s.style.animationDelay = (Math.random() * 9) + "s";
    hearts.appendChild(s);
  }
</script>
</body>
</html>
